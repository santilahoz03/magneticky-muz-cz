<!doctype html>
<html lang="cs">
<head>

<title>Magnetický Muž · Přístup</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#FBF9F5;color:#17130E;padding:32px 16px 60px}
.wrap{max-width:520px;margin:0 auto}
.label{font-size:11px;font-weight:800;letter-spacing:.12em;color:#A63A2A;text-transform:uppercase;margin-bottom:8px}
h1{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:20px}
.dl-btn{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #E2D9CE;border-radius:10px;padding:16px 18px;text-decoration:none;color:#17130E;font-size:15px;font-weight:700;transition:border-color .15s}
.dl-btn:hover{border-color:#A63A2A}
.ico{width:36px;height:36px;background:#F2EDE5;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:18px}
.footer{margin-top:32px;font-size:13px;color:#6B5E54;text-align:center;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <p class="label">Magnetický Muž · OTO 2</p>

  <p style="font-size:15px;line-height:1.6;margin-bottom:20px;color:#6B5E54;">Tvůj přístup je potvrzen. Klikni níže pro stažení.</p>
  <a class="dl-btn" href="whatsapp-profil.pdf"><span class="ico">📄</span>whatsapp profil</a>

</div>
